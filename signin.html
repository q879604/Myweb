<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WQ - 签到</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
        :root { --accent: #00d4ff; --glow: rgba(0,212,255,0.5); --text-primary: #fff; --text-secondary: rgba(255,255,255,0.7); }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background-image: url('zhefen.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
            padding-top: 100px;
            padding-bottom: 80px;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10,10,30,0.55); z-index: -1; }
        .time-display { text-align: center; margin-bottom: 2rem; }
        .time-display .time { font-family: 'Orbitron', monospace; font-size: 2.5rem; font-weight: 700; color: var(--accent); text-shadow: 0 0 15px var(--glow); animation: pulse-glow 3s ease-in-out infinite; }
        .time-display .date { font-size: 1rem; color: var(--text-secondary); margin-top: 0.3rem; }
        .time-display a { text-decoration: none; color: inherit; cursor: pointer; }
        .time-display a:hover .time { opacity: 0.8; }
        .header { text-align: center; margin-bottom: 1.2rem; }
        .header h1 { font-size: 2.2rem; font-weight: 300; letter-spacing: 0.2em; background: linear-gradient(135deg, #fff, var(--accent), #fff, var(--accent)); background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradient-flow 3s ease infinite; }
        .header p { color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.5rem; letter-spacing: 0.3em; }
        .checkin-wrap {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0;
        }
        .checkin-item {
            flex: 1;
            min-width: 220px;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            animation: card-appear 0.5s ease-out backwards;
            will-change: transform;
        }
        .checkin-item:nth-child(1) { animation-delay: 0.03s; }
        .checkin-item:nth-child(2) { animation-delay: 0.13s; }
        .checkin-item:nth-child(3) { animation-delay: 0.23s; }
        .checkin-item:hover {
            background: rgba(0,212,255,0.25);
            border-color: var(--accent);
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .checkin-item:active {
            transform: scale(1.06);
            border-color: var(--accent);
            box-shadow: 0 12px 28px rgba(0,0,0,0.4);
            transition: transform 0.1s ease, border-color 0.1s ease, box-shadow 0.1s ease;
        }
        .checkin-item:active .checkin-icon {
            transform: scale(1.12) rotate(8deg);
        }
        .checkin-icon {
            font-size: 1.5rem;
            color: var(--accent);
            transition: transform 0.2s ease;
            will-change: transform;
        }
        .checkin-item:hover .checkin-icon {
            transform: scale(1.08) rotate(4deg);
        }
        .checkin-item .name { font-size: 1.15rem; font-weight: 600; letter-spacing: 0.05em; }
        .footer { text-align: center; margin-top: 2.5rem; color: var(--text-secondary); font-size: 0.8rem; letter-spacing: 0.1em; }
        @keyframes pulse-glow { 0%,100% { text-shadow: 0 0 15px var(--glow); } 50% { text-shadow: 0 0 25px var(--glow), 0 0 50px rgba(0,212,255,0.3); } }
        @keyframes gradient-flow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes card-appear { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            .checkin-wrap { padding: 1.2rem; gap: 1rem; }
            .checkin-item { min-width: 100%; padding: 0.9rem 1rem; }
            .checkin-item .name { font-size: 1rem; }
            .header h1 { font-size: 1.8rem; }
            .time-display .time { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="time-display"><a href="https://beijingshijian.net/" target="_blank" style="text-decoration: none; color: inherit; cursor: pointer;"><div class="time" id="time">00:00:00</div><div class="date" id="date">加载中...</div></a></div>
    <div class="header"><h1>WQ·签到</h1><p>Check-in Center</p></div>
    <div class="checkin-wrap">
        <a href="https://www.modelscope.cn" target="_blank" class="checkin-item"><span class="checkin-icon"><i class="fas fa-robot"></i></span><span class="name">魔塔社区</span></a>
        <a href="https://console.stellarfrp.top/dashboard" target="_blank" class="checkin-item"><span class="checkin-icon"><i class="fas fa-right-left"></i></span><span class="name">恒星映射</span></a>
        <a href="https://api.hcnsec.cn/profile" target="_blank" class="checkin-item"><span class="checkin-icon"><i class="fas fa-shield-alt"></i></span><span class="name">幻城网安公益中转</span></a>
    </div>
    <script>
        function updateTime() { const n=new Date(); document.getElementById('time').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0'); const d=['日','一','二','三','四','五','六'][n.getDay()]; document.getElementById('date').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 星期'+d; }
        updateTime(); setInterval(updateTime,1000);
    </script>
    <div class="footer">© 2026 WQ · Check-in</div>
</body>
</html>
