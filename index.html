<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GQ - 个人导航</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent: #e94560;
            --glow: rgba(233, 69, 96, 0.4);
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--text-primary);
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
            letter-spacing: 0.2em;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            max-width: 1000px;
            width: 100%;
        }
        .card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .card:hover::before { opacity: 1; }
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            background: var(--card-hover);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px var(--glow);
        }
        .card.active {
            transform: scale(1.05);
            z-index: 100;
            pointer-events: none;
        }
        .card-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            transition: all 0.4s ease;
        }
        .card:hover .card-icon {
            transform: scale(1.1) rotate(5deg);
        }
        .card.active .card-icon {
            transform: scale(0);
            opacity: 0;
        }
        .icon-vnc { background: linear-gradient(135deg, #667eea, #764ba2); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
        .icon-alist { background: linear-gradient(135deg, #f093fb, #f5576c); box-shadow: 0 10px 30px rgba(240, 147, 251, 0.4); }
        .icon-wiki { background: linear-gradient(135deg, #4facfe, #00f2fe); box-shadow: 0 10px 30px rgba(79, 172, 254, 0.4); }
        .icon-adb { background: linear-gradient(135deg, #43e97b, #38f9d7); box-shadow: 0 10px 30px rgba(67, 233, 123, 0.4); }
        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            transition: all 0.3s ease;
        }
        .card.active .card-title {
            opacity: 0;
            transform: translateY(-20px);
        }
        .card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }
        .card.active .card-desc {
            opacity: 0;
        }
        /* 展开菜单 */
        .expanded-menu {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 1rem;
        }
        .card.active .expanded-menu {
            opacity: 1;
            visibility: visible;
        }
        .menu-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            transform: translateY(20px);
            opacity: 0;
        }
        .card.active .menu-item {
            transform: translateY(0);
            opacity: 1;
        }
        .card.active .menu-item:nth-child(1) { transition-delay: 0.1s; }
        .card.active .menu-item:nth-child(2) { transition-delay: 0.2s; }
        .menu-item:hover {
            background: rgba(233, 69, 96, 0.3);
            transform: scale(1.05);
        }
        .menu-item i {
            font-size: 1.5rem;
            color: var(--accent);
        }
        .menu-item span {
            font-size: 0.9rem;
            font-weight: 500;
        }
        /* 时间显示 */
        .time-display {
            position: fixed;
            top: 2rem;
            right: 2rem;
            text-align: right;
        }
        .time-display .time {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.1em;
        }
        .time-display .date {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        /* 底部信息 */
        .footer {
            position: fixed;
            bottom: 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        /* 点击遮罩 */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 50;
        }
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .card { padding: 1.5rem 1rem; }
            .card-icon { width: 60px; height: 60px; font-size: 2rem; }
            .header h1 { font-size: 2rem; }
            .time-display { top: 1rem; right: 1rem; }
            .time-display .time { font-size: 1.5rem; }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="time-display">
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">加载中...</div>
    </div>
    
    <div class="header">
        <h1>GQ</h1>
        <p>个人导航中心</p>
    </div>
    
    <div class="overlay" id="overlay" onclick="closeAll()"></div>
    
    <div class="grid">
        <!-- VNC 远控 -->
        <div class="card" id="vnc-card" onclick="toggleCard('vnc-card')">
            <div class="card-icon icon-vnc">
                <i class="fas fa-desktop"></i>
            </div>
            <div class="card-title">VNC 远控</div>
            <div class="card-desc">远程桌面控制</div>
            <div class="expanded-menu">
                <a href="http://100.96.22.89:5456/vnc.html?autoconnect=true&show_dot=true&host=100.96.22.89&port=5556" target="_blank" class="menu-item">
                    <i class="fas fa-globe"></i>
                    <span>外网访问</span>
                </a>
                <a href="http://192.168.124.11:5456/vnc.html?autoconnect=true&show_dot=true&host=192.168.124.11&port=5556" target="_blank" class="menu-item">
                    <i class="fas fa-home"></i>
                    <span>内网访问</span>
                </a>
            </div>
        </div>
        
        <!-- Alist 网盘 -->
        <div class="card" id="alist-card" onclick="toggleCard('alist-card')">
            <div class="card-icon icon-alist">
                <i class="fas fa-cloud"></i>
            </div>
            <div class="card-title">私人网盘</div>
            <div class="card-desc">Alist 文件管理</div>
            <div class="expanded-menu">
                <a href="http://100.96.22.89:5244" target="_blank" class="menu-item">
                    <i class="fas fa-globe"></i>
                    <span>外网访问</span>
                </a>
                <a href="http://192.168.124.11:5244" target="_blank" class="menu-item">
                    <i class="fas fa-home"></i>
                    <span>内网访问</span>
                </a>
            </div>
        </div>
        
        <!-- 维基百科 -->
        <div class="card" id="wiki-card" onclick="toggleCard('wiki-card')">
            <div class="card-icon icon-wiki">
                <i class="fab fa-wikipedia-w"></i>
            </div>
            <div class="card-title">维基百科</div>
            <div class="card-desc">知识搜索</div>
            <div class="expanded-menu">
                <a href="http://100.96.22.89:8080" target="_blank" class="menu-item">
                    <i class="fas fa-globe"></i>
                    <span>外网访问</span>
                </a>
                <a href="http://192.168.124.11:8080" target="_blank" class="menu-item">
                    <i class="fas fa-home"></i>
                    <span>内网访问</span>
                </a>
            </div>
        </div>
        
        <!-- ADB 助手 -->
        <div class="card" onclick="window.open('https://wwayw.lanzoub.com/b01euqiwwf', '_blank')">
            <div class="card-icon icon-adb">
                <i class="fas fa-mobile-alt"></i>
            </div>
            <div class="card-title">ADB 助手</div>
            <div class="card-desc">密码: 1234</div>
        </div>
    </div>
    
    <div class="footer">
        <p>© 2026 GQ · Personal Navigation</p>
    </div>
    
    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
            
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekDay = weekDays[now.getDay()];
            document.getElementById('date').textContent = `${year}-${month}-${day} ${weekDay}`;
        }
        
        function toggleCard(cardId) {
            const card = document.getElementById(cardId);
            const overlay = document.getElementById('overlay');
            const isActive = card.classList.contains('active');
            
            // 关闭所有其他卡片
            closeAll();
            
            // 如果当前卡片未激活，则激活它
            if (!isActive) {
                card.classList.add('active');
                overlay.classList.add('active');
            }
        }
        
        function closeAll() {
            document.querySelectorAll('.card').forEach(card => {
                card.classList.remove('active');
            });
            document.getElementById('overlay').classList.remove('active');
        }
        
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
