<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GQ - 主页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --bg-dark: #0a0a1a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --glow-color: rgba(102, 126, 234, 0.5);
        }
        [data-theme="light"] {
            --primary: #5a67d8;
            --secondary: #6b46c1;
            --accent: #d53f8c;
            --bg-dark: #f7fafc;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-primary: #1a202c;
            --text-secondary: rgba(0, 0, 0, 0.6);
            --glow-color: rgba(90, 103, 216, 0.3);
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a3e 50%, var(--bg-dark) 100%);
            transition: background 0.3s ease;
        }
        .bg-gradient::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 70%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 30%, rgba(118, 75, 162, 0.15) 0%, transparent 50%);
            animation: bgMove 20s ease-in-out infinite alternate;
        }
        @keyframes bgMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(30px, 30px) rotate(5deg); }
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: rise linear infinite;
            opacity: 0.4;
        }
        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 1000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--text-secondary);
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--glow-color);
        }
        .theme-toggle .fa-moon { display: none; }
        .theme-toggle .fa-sun { display: block; }
        [data-theme="light"] .theme-toggle .fa-moon { display: block; }
        [data-theme="light"] .theme-toggle .fa-sun { display: none; }
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
        }
        .hero.scrolled {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
        .hero-title {
            font-size: clamp(5rem, 15vw, 12rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            background: linear-gradient(135deg, var(--primary), var(--accent), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 3s ease-in-out infinite alternate;
            line-height: 1;
            text-shadow: 0 0 80px var(--glow-color);
        }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 20px var(--glow-color)); }
            100% { filter: drop-shadow(0 0 50px var(--accent)); }
        }
        .hero-subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.4em;
            margin-top: 1.5rem;
            opacity: 0;
            animation: fadeIn 1s ease forwards 0.3s;
        }
        .scroll-hint {
            position: absolute;
            bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1s;
        }
        .scroll-hint span {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        .scroll-arrow {
            width: 20px;
            height: 20px;
            border-right: 2px solid var(--text-secondary);
            border-bottom: 2px solid var(--text-secondary);
            transform: rotate(45deg);
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 0.4; }
            50% { transform: rotate(45deg) translate(6px, 6px); opacity: 1; }
        }
        @keyframes fadeIn { to { opacity: 1; } }
        .content {
            min-height: 100vh;
            padding: 4rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }
        .section-label, .section-title {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }
        .section-label.visible, .section-title.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .section-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        .section-title {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 700;
            margin-bottom: 3rem;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            margin: 1rem auto 0;
            border-radius: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.2rem;
        }
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.8rem;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(30px);
            position: relative;
            overflow: hidden;
        }
        [data-theme="light"] .card {
            border-color: rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(240, 147, 251, 0.1));
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .card:hover::before { opacity: 1; }
        .card.visible { opacity: 1; transform: translateY(0); }
        .card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 15px 40px var(--glow-color), 0 0 40px var(--glow-color);
        }
        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            transition: transform 0.4s ease;
            position: relative;
            z-index: 1;
        }
        .card:hover .card-icon { transform: scale(1.1); }
        .icon-qq { background: linear-gradient(135deg, #12B7F5, #00AAFF); box-shadow: 0 6px 20px rgba(18, 183, 245, 0.35); }
        .icon-wechat { background: linear-gradient(135deg, #07C160, #109E4B); box-shadow: 0 6px 20px rgba(7, 193, 96, 0.35); }
        .icon-bilibili { background: linear-gradient(135deg, #FB7299, #FC4F7B); box-shadow: 0 6px 20px rgba(251, 114, 153, 0.35); }
        .icon-email { background: linear-gradient(135deg, #EA4335, #FBBC04); box-shadow: 0 6px 20px rgba(234, 67, 53, 0.35); }
        .card-body { flex: 1; position: relative; z-index: 1; }
        .card-body h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.25rem; }
        .card-body p { font-size: 0.85rem; color: var(--text-secondary); }
        .card-arrow {
            color: var(--text-secondary);
            font-size: 1rem;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 1;
        }
        .card:hover .card-arrow { transform: translateX(4px); color: var(--accent); }
        .footer {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 2rem;
        }
        [data-theme="light"] .footer { border-top-color: rgba(0, 0, 0, 0.1); }
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .card { padding: 1.4rem; }
            .theme-toggle { width: 44px; height: 44px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">
        <i class="fas fa-sun"></i>
        <i class="fas fa-moon"></i>
    </button>
    <section class="hero" id="hero">
        <h1 class="hero-title">GQ</h1>
        <p class="hero-subtitle">欢迎来到我的个人主页</p>
        <div class="scroll-hint"><span>向上滑动</span><div class="scroll-arrow"></div></div>
    </section>
    <section class="content" id="content">
        <p class="section-label" data-animate>联系 & 社交</p>
        <h2 class="section-title" data-animate>找到我</h2>
        <div class="grid">
            <a href="https://user.qzone.qq.com/2205003852" class="card" target="_blank" rel="noopener noreferrer" data-card data-delay="0">
                <div class="card-icon icon-qq"><i class="fab fa-qq"></i></div>
                <div class="card-body"><h3>访问我的主页</h3><p>QQ: 2205003852</p></div>
                <i class="fas fa-chevron-right card-arrow"></i>
            </a>
            <div class="card" data-card data-delay="80">
                <div class="card-icon icon-wechat"><i class="fab fa-weixin"></i></div>
                <div class="card-body"><h3>微信联系</h3><p>微信号: q677xl</p></div>
                <i class="fas fa-copy card-arrow" title="点击复制"></i>
            </div>
            <a href="https://space.bilibili.com/3546863106001033" class="card" target="_blank" rel="noopener noreferrer" data-card data-delay="160">
                <div class="card-icon icon-bilibili"><i class="fab fa-bilibili"></i></div>
                <div class="card-body"><h3>B站关注</h3><p>UID: 3546863106001033</p></div>
                <i class="fas fa-chevron-right card-arrow"></i>
            </a>
            <a href="mailto:2205003852@qq.com" class="card" data-card data-delay="240">
                <div class="card-icon icon-email"><i class="fas fa-envelope"></i></div>
                <div class="card-body"><h3>发送邮件</h3><p>2205003852@qq.com</p></div>
                <i class="fas fa-chevron-right card-arrow"></i>
            </a>
        </div>
    </section>
    <footer class="footer"><p>© 2026 GQ · All Rights Reserved</p></footer>
    <script>
        const pc = document.getElementById('particles');
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 15 + 10) + 's';
            p.style.animationDelay = (Math.random() * 15) + 's';
            p.style.width = p.style.height = (Math.random() * 3 + 2) + 'px';
            pc.appendChild(p);
        }
        const hero = document.getElementById('hero');
        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(() => {
                    if (window.scrollY > 80) { hero.classList.add('scrolled'); }
                    else { hero.classList.remove('scrolled'); }
                    ticking = false;
                });
                ticking = true;
            }
        });
        const animEls = document.querySelectorAll('[data-animate], [data-card]');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const delay = parseInt(entry.target.dataset.delay || 0);
                    setTimeout(() => entry.target.classList.add('visible'), delay);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });
        animEls.forEach(el => observer.observe(el));
        const wechatCard = document.querySelector('.icon-wechat')?.closest('.card');
        if (wechatCard) {
            wechatCard.addEventListener('click', () => {
                navigator.clipboard.writeText('q677xl').then(() => {
                    const toast = document.createElement('div');
                    toast.textContent = '微信号已复制！';
                    toast.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:rgba(102,126,234,0.9);color:#fff;padding:0.6rem 1.5rem;border-radius:30px;font-size:0.9rem;z-index:9999;animation:fadeInUp 0.3s ease;pointer-events:none;';
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 1500);
                });
            });
            wechatCard.style.cursor = 'pointer';
        }
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) { html.setAttribute('data-theme', savedTheme); }
        else if (window.matchMedia('(prefers-color-scheme: light)').matches) { html.setAttribute('data-theme', 'light'); }
        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    </script>
</body>
</html>
